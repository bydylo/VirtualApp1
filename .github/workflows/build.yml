name: Build VirtualApp FINAL
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-18.04
    steps:
      - uses: actions/checkout@v4

      - name: Java 8
        uses: actions/setup-java@v1
        with:
          java-version: 8

      - name: Baixar NDK r10e
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
          unzip android-ndk-r10e-linux-x86_64.zip
          echo "ndk.dir=$PWD/android-ndk-r10e" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Compilar nativo
        run: |
          cd lib/src/main/jni
          ../../../android-ndk-r10e/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk

      - name: Permissão e compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-build-cache

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualApp_APK_PRONTO
          path: app/build/outputs/apk/debug/app-debug.apk
