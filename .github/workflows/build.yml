name: Build VirtualApp Certo
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Pegar código
        uses: actions/checkout@v4

      - name: Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'adopt'

      - name: Baixar NDK r10e (correto)
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
          unzip -q android-ndk-r10e-linux-x86_64.zip
          echo "ndk.dir=$PWD/android-ndk-r10e" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Compilar código nativo
        run: |
          cd lib/src/main/jni
          ../../../android-ndk-r10e/ndk-build

      - name: Dar permissão e compilar APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualApp_APK_FINAL
          path: app/build/outputs/apk/debug/app-debug.apk
